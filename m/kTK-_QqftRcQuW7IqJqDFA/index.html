 = ((-90 + (i * 360) / n) * Math.PI) / 180\n    return [round(Math.cos(t) * 38), round(Math.sin(t) * 38)]\n  })\nconst resample = (pts, count) => {\n  const len = pts.map((p, i) => Math.hypot(pts[(i + 1) % pts.length][0] - p[0], pts[(i + 1) % pts.length][1] - p[1]))\n  const total = len.reduce((x, y) => x + y, 0)\n  return Array.from({ length: count }, (_, k) => {\n    let at = (total * k) / count\n    let i = 0\n    while (i \u003c pts.length - 1 && at >= len[i] - 1e-9) {\n      at -= len[i]\n      i += 1\n    }\n    const f = len[i] > 0 ? at / len[i] : 0\n    const p = pts[i]\n    const q = pts[(i + 1) % pts.length]\n    return [round(p[0] + (q[0] - p[0]) * f), round(p[1] + (q[1] - p[1]) * f)]\n  })\n}\nconst shapes = [3, 4, 5, 6].map((n) => resample(regular(n), 24))\nconst ease = (t) => (t \u003c 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2)\nconst draw = (cycle) => {\n  const i = Math.floor(cycle) % shapes.length\n  const f = cycle % 1\n  const m = f \u003c 0.4 ? 0 : ease((f - 0.4) / 0.6)\n  const next = shapes[(i + 1) % shapes.length]\n  poly.setAttribute(\"points\", shapes[i].map((p, k) => `${round(p[0] + (next[k][0] - p[0]) * m)},${round(p[1] + (next[k][1] - p[1]) * m)}`).join(\" \"))\n}\nconst tick = (ts) => {\n  draw(ts / 1400)\n  requestAnimationFrame(tick)\n}\nif (reduced) draw(2)\nelse requestAnimationFrame(tick)\n\u003c/script>","trigger":"loop","behavior":"script","autoPointer":false,"autoScroll":false,"items":0,"oneShot":false,"vars":[]},"fields":{"times":[],"ease":false}}</script></div></section><script type="module" src="../../_astro/_token_.astro_astro_type_script_index_0_lang.CW21bvdf.js"></script></main><script type="module">document.addEventListener(`click`,async e=>{let t=e.target.closest(`[data-copy]`);if(t){try{await navigator.clipboard.writeText(t.dataset.copy??``)}catch{return}t.dataset.copied=`true`,window.setTimeout(()=>delete t.dataset.copied,1500)}});var e=(e,t)=>{let n=Math.min(1280,e),r=Math.min(860,t);return`popup=yes,width=
